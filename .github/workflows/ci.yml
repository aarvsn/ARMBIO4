name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Java and Gradle environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_OPTS=$JAVA_OPTS"
          echo "GRADLE_OPTS=$GRADLE_OPTS"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
          echo "--- Java version ---"
          java -version
          echo "--- Gradle version ---"
          ./gradlew --version
          echo "--- Gradle JVM options ---"
          grep -n "DEFAULT_JVM_OPTS" gradlew || true
          echo "--- Search for Xmx64m/Xms64m ---"
          grep -R --exclude-dir=.git --exclude-dir=build \
            -nE 'Xmx64m|Xms64m' . || true

      - name: Build debug APK
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JAVA_TOOL_OPTIONS: ""
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JAVA_TOOL_OPTIONS: ""
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Java and Gradle environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_OPTS=$JAVA_OPTS"
          echo "GRADLE_OPTS=$GRADLE_OPTS"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
          java -version
          ./gradlew --version
          grep -n "DEFAULT_JVM_OPTS" gradlew || true
          grep -R --exclude-dir=.git --exclude-dir=build \
            -nE 'Xmx64m|Xms64m' . || true

      - name: Run lint
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JAVA_TOOL_OPTIONS: ""
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html

  native-check:
    name: Native Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C code formatting
        run: |
          find app/src/main/cpp -name "*.c" -o -name "*.h" | while read f; do
            diff <(clang-format "$f") "$f" || (
              echo "❌ $f needs formatting"
              exit 1
            )
          done
        continue-on-error: true
